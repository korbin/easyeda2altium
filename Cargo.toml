[package]
name = "easyeda2altium"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
altium = { git = "https://github.com/korbin/altiumrs.git" }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "gzip", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52.2", features = ["rt-multi-thread", "macros", "fs", "io-util"] }

[[bin]]
name = "easyeda2altium"
path = "src/main.rs"

[lib]
name = "easyeda2altium"
path = "src/lib.rs"
